; BodyLanguage.ini
; Place this file at: Data/SKSE/Plugins/BodyLanguage.ini

[NormalMapAnalysis]
; Empirical 2D Laplacian energy baselines at 256x256 mipmap resolution.
; SmoothBaseline: normal map roughness at or below this value maps to S_tex_tone = 0.0 (smooth/soft skin)
; RippedBaseline: normal map roughness at or above this value maps to S_tex_tone = 1.0 (deep muscle grooves)
SmoothBaseline=0.018
RippedBaseline=0.045

[Exclusions]
; Comma-separated list of NPCs to exclude from BodyLanguage evaluation and description blocks.
; Excluded NPCs will not be evaluated and no BodyLanguage description block will be added for them.
; Supported formats:
;   - player                 (special keyword for the player character)
;   - Plugin.esp:ShortFormID (e.g. Skyrim.esm:13B97, Dawnguard.esm:0x2B6C)
;   - EditorID               (e.g. DLC1Serana, HousecarlWhiterun)
ExcludedNPCs=

